<!doctype html>
<html lang="ar" dir="rtl" data-theme="system" data-resolved-theme="light" data-ayah-text-size="medium">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="أذكار الصباح والمساء في صفحة عربية خفيفة مع عدادات تحفظ التقدم محليًا.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f5ef" id="theme-color">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preload" href="./fonts/kfgqpc-uthman-taha-naskh.ttf" as="font" type="font/ttf" crossorigin>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="أذكار المسلم">
  <title>أذكار المسلم — الصباح والمساء</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem("athkar-theme");
        const theme = ["light", "dark", "system"].includes(saved) ? saved : "system";
        const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.resolvedTheme = dark ? "dark" : "light";
      } catch (_) {}
      try {
        const savedAyahTextSize = localStorage.getItem("athkar-text-size");
        document.documentElement.dataset.ayahTextSize = ["small", "medium", "large", "xlarge"].includes(savedAyahTextSize)
          ? savedAyahTextSize
          : "medium";
      } catch (_) {}
      try {
        const switchProbe = document.createElement("input");
        switchProbe.type = "checkbox";
        switchProbe.setAttribute("switch", "");
        switchProbe.indeterminate = true;
        if (!switchProbe.matches(":indeterminate")) {
          document.documentElement.classList.add("supports-native-switch");
        }
      } catch (_) {}
    })();
  </script>
  <style>
    @font-face {
      font-family: "KFGQPC Uthman Taha Naskh";
      src: url("./fonts/kfgqpc-uthman-taha-naskh.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      --background: #f7f5ef;
      --background-glow: #eef7f7;
      --surface: #fffefa;
      --surface-raised: #ffffff;
      --text-primary: #18232d;
      --text-secondary: #69747d;
      --reference: #15557a;
      --accent: #137d91;
      --accent-strong: #0d6879;
      --accent-soft: #e2f1f1;
      --border: #deddd5;
      --divider: #c9d7d9;
      --completed: #327557;
      --completed-soft: #e8f2e9;
      --warning: #8a622c;
      --warning-soft: #fbf1dd;
      --focus: #176f87;
      --shadow: 0 14px 38px rgba(35, 49, 58, 0.08);
      --shadow-soft: 0 6px 22px rgba(35, 49, 58, 0.06);
      --radius-xl: 1.75rem;
      --radius-lg: 1.25rem;
      --content-width: 49rem;
      --font-arabic: "Noto Naskh Arabic", "Noto Sans Arabic", "Traditional Arabic", Tahoma, Arial, sans-serif;
      --quran-prefix-size: clamp(1.2rem, 5vw, 1.58rem);
      --quran-text-size: clamp(1.3rem, 5.6vw, 1.82rem);
    }

    :root[data-ayah-text-size="small"] {
      --quran-prefix-size: clamp(1.05rem, 4.45vw, 1.4rem);
      --quran-text-size: clamp(1.15rem, 5vw, 1.62rem);
    }

    :root[data-ayah-text-size="large"] {
      --quran-prefix-size: clamp(1.35rem, 5.75vw, 1.82rem);
      --quran-text-size: clamp(1.45rem, 6.4vw, 2.12rem);
    }

    :root[data-ayah-text-size="xlarge"] {
      --quran-prefix-size: clamp(1.52rem, 6.55vw, 2.08rem);
      --quran-text-size: clamp(1.65rem, 7.3vw, 2.42rem);
    }

    :root[data-resolved-theme="dark"] {
      color-scheme: dark;
      --background: #202c38;
      --background-glow: #263b47;
      --surface: #293946;
      --surface-raised: #30414f;
      --text-primary: #f6f3ec;
      --text-secondary: #aeb8c1;
      --reference: #28b6d2;
      --accent: #23b4cf;
      --accent-strong: #6bd2e2;
      --accent-soft: #183f4a;
      --border: #435361;
      --divider: #536775;
      --completed: #70c58d;
      --completed-soft: #254838;
      --warning: #e0bc70;
      --warning-soft: #4b4028;

      --shadow: 0 18px 48px rgba(4, 11, 18, 0.22);
      --shadow-soft: 0 8px 28px rgba(4, 11, 18, 0.16);
    }

    body[data-period="morning"] {
      --accent: #b85f59;
      --accent-strong: #914640;
      --accent-soft: #f7e6e3;
      --divider: #e6c2bf;
      --focus: #a9514b;
      --reference: #143872;
      --background-glow: #faeeee;
    }

    :root[data-resolved-theme="dark"] body[data-period="morning"] {
      --accent: #ef8d86;
      --accent-strong: #ffc1bb;
      --accent-soft: #4c302f;
      --divider: #704b4a;
      --focus: #ffaaa4;
      --reference: #8cc7ef;
      --background-glow: #3b3038;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      min-width: 20rem;
      scroll-behavior: smooth;
      background: var(--background);
    }

    body {
      min-height: 100vh;

      overflow-x: hidden;

        radial-gradient(circle at 50% -10rem, var(--background-glow), transparent 34rem),
        var(--background);

      font-family: var(--font-arabic);
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      transition: background-color 180ms ease, color 180ms ease;
    }

    button, select { font: inherit; }
    button, select, a { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }

    .skip-link {
      position: fixed;
      inset-block-start: 0.5rem;
      inset-inline-start: 0.5rem;
      z-index: 100;
      padding: 0.7rem 1rem;
      border-radius: 0.75rem;
      background: var(--text-primary);
      color: var(--surface);
      transform: translateY(-150%);
      transition: transform 120ms ease;
    }

    .skip-link:focus { transform: translateY(0); }

    .app-shell {
      width: min(100%, var(--content-width));
      margin-inline: auto;
      padding: max(1rem, env(safe-area-inset-top)) clamp(0.75rem, 3.5vw, 1.5rem) max(2rem, env(safe-area-inset-bottom));
    }

    .app-header { margin-block-end: 1.15rem; }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.45rem 0.35rem 1.15rem;
    }

    .eyebrow {
      margin: 0 0 0.2rem;
      color: var(--accent-strong);
      font-family: "Noto Sans Arabic", Tahoma, Arial, sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 8vw, 2.35rem);
      font-weight: 800;
      line-height: 1.15;
    }

    .theme-wrap {
      position: relative;
      flex: none;
    }

    .theme-wrap::before {
      content: "◐";
      position: absolute;
      inset-block-start: 50%;
      inset-inline-start: 0.72rem;
      z-index: 1;
      color: var(--text-secondary);
      font-family: Arial, sans-serif;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .theme-select {
      min-height: 2.75rem;
      padding: 0.5rem 2.2rem 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      appearance: none;
      background: var(--surface-raised);
      color: var(--text-secondary);
      box-shadow: var(--shadow-soft);
      font-family: "Noto Sans Arabic", Tahoma, Arial, sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .period-tabs {
      position: sticky;
      inset-block-start: max(0.65rem, env(safe-area-inset-top));
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem;
      padding: 0.35rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: color-mix(in srgb, var(--surface-raised) 92%, transparent);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .period-tab {
      display: inline-flex;
      min-height: 3.15rem;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      padding: 0.55rem 0.8rem;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--text-secondary);
      font-family: "Noto Sans Arabic", Tahoma, Arial, sans-serif;
      font-weight: 800;
      cursor: pointer;
      transition: color 150ms ease, background-color 150ms ease, transform 100ms ease;
    }

    .period-tab[aria-selected="true"] {
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .period-tab:active { transform: scale(0.985); }

    .period-icon {
      width: 1.2rem;
      height: 1.2rem;
      flex: none;
    }

    .session-summary {
      margin-block-start: 0.85rem;
      padding: 1.05rem 1.1rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      box-shadow: var(--shadow-soft);
    }

    .summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .summary-actions {
      display: flex;
      flex: none;
      align-items: center;
      justify-content: flex-end;
      gap: 0.45rem;
    }


    .haptics-control {
      display: inline-flex;
      min-height: 2.75rem;
      align-items: center;
      justify-content: center;
      gap: 0.42rem;
      padding: 0.35rem 0.55rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-raised);
      color: var(--text-secondary);
      font-family: "Noto Sans Arabic", Tahoma, Arial, sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: color 150ms ease, border-color 150ms ease, background-color 150ms ease;
    }

    .haptics-control:has(.haptics-input:checked) {
      border-color: color-mix(in srgb, var(--accent) 42%, var(--border));
      color: var(--accent-strong);
    }

    .haptics-switch {
      position: relative;
      display: inline-block;
      width: 2.25rem;
      height: 1.3rem;
      flex: none;
      direction: ltr;
    }

    .haptics-input {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      appearance: auto;
      accent-color: var(--accent);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .haptics-input:focus-visible { outline: none; }

    .haptics-track {
      position: absolute;
      inset: 0;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--divider);
      pointer-events: none;
      transition: background-color 150ms ease, border-color 150ms ease;
    }

    .haptics-track::after {
      content: "";
      position: absolute;
      inset-block-start: 50%;
      inset-inline-start: 0.14rem;
      width: 0.92rem;
      height: 0.92rem;
      border-radius: 50%;
      background: var(--surface-raised);
      box-shadow: 0 1px 4px rgba(18, 31, 39, 0.2);
      transform: translateY(-50%);
      transition: transform 150ms ease;
    }

    .haptics-input:checked + .haptics-track {
      border-color: var(--accent);
      background: var(--accent);
    }

    .haptics-input:checked + .haptics-track::after {
      transform: translate(0.94rem, -50%);
    }

    .haptics-input:focus-visible + .haptics-track {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    :root.supports-native-switch .haptics-switch {
      display: inline-flex;
      width: auto;
      height: auto;
      align-items: center;
    }

    :root.supports-native-switch .haptics-input {
      position: static;
      inset: auto;
      width: auto;
      height: auto;
      opacity: 1;
    }

    :root.supports-native-switch .haptics-track { display: none; }

    :root.supports-native-switch .haptics-input:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .session-title {
      margin: 0;
      font-size: clamp(1.2rem, 5vw, 1.55rem);
      line-height: 1.3;
    }

    .session-progress-copy {
      margin: 0.22rem 0 0;
      color: var(--text-secondary);
      font-family: "Noto Sans Arabic", Tahoma, Arial, sans-serif;
      font-size: 0.85rem;
      font-weight: 650;
    }

    .session-reset,
    .card-reset {
      display: inline-flex;
      min-width: 2.75rem;
      min-height: 2.75rem;
      align-items: center;
      justify-content: center;
      gap: 0.32rem;
      padding: 0.4rem 0.68rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-raised);
      color: var(--text-secondary);
      font-family: "Noto Sans Arabic", Tahoma, Arial, sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 120ms ease, transform 100ms ease, border-color 120ms ease;
    }

    .session-reset:active,
    .card-reset:active { transform: scale(0.96); }

    .session-reset:disabled,
    .card-reset:disabled {
      opacity: 0.36;
      cursor: default;
    }

    .progress-track {
      width: 100%;
      height: 0.34rem;
      margin-block-start: 0.9rem;
      overflow: hidden;
      border: 0;
      border-radius: 999px;
      appearance: none;
      background: var(--border);
    }

    .progress-track::-webkit-progress-bar {
      border-radius: 999px;
      background: var(--border);
    }

    .progress-track::-webkit-progress-value {
      border-radius: 999px;
      background: var(--accent);
      transition: width 220ms ease;
    }

    .progress-track::-moz-progress-bar {
      border-radius: 999px;
      background: var(--accent);
    }

    .session-summary.is-complete .progress-track::-webkit-progress-value { background: var(--completed); }
    .session-summary.is-complete .progress-track::-moz-progress-bar { background: var(--completed); }

    main { display: block; }

    .athkar-list {
      position: relative;
      isolation: isolate;
      block-size: clamp(30rem, 68vh, 38rem);
      block-size: clamp(30rem, 68svh, 38rem);
      margin: 0 0 1.35rem;
      padding: 0 0 1rem;
      list-style: none;
      scroll-margin-block-start: 5.5rem;
      touch-action: pan-y pinch-zoom;
    }

    .athkar-list::before,
    .athkar-list::after {
      content: "";
      position: absolute;
      z-index: 0;
      inset-block-end: 0.1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      background: color-mix(in srgb, var(--surface) 82%, var(--background));
      box-shadow: var(--shadow-soft);
      pointer-events: none;
    }

    .athkar-list::before {
      inset-block-start: 1rem;
      inset-inline: 1.15rem;
      opacity: 0.48;
    }

    .athkar-list::after {
      inset-block-start: 0.55rem;
      inset-block-end: 0.55rem;
      inset-inline: 0.58rem;
      opacity: 0.72;
    }

    .athkar-list > li {
      position: relative;
      z-index: 2;
      block-size: 100%;
    }

    .athkar-list > li[hidden] { display: none; }
    .athkar-list.is-entering { animation: section-in 180ms ease both; }
    .athkar-list > li.card-enter-forward { animation: card-forward 210ms ease both; }
    .athkar-list > li.card-enter-back { animation: card-back 210ms ease both; }

    .deck-navigation {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.75rem;
      margin-block-start: 0.3rem;
    }

    .deck-button {
      display: inline-flex;
      min-width: 6.2rem;
      min-height: 3rem;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.55rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-raised);
      color: var(--text-primary);
      box-shadow: var(--shadow-soft);
      font-family: "Noto Sans Arabic", Tahoma, Arial, sans-serif;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 100ms ease, opacity 120ms ease, border-color 120ms ease;
    }

    .deck-button:first-child { justify-self: start; }
    .deck-button:last-child { justify-self: end; }
    .deck-button:active { transform: scale(0.97); }
    .deck-button:disabled { opacity: 0.34; cursor: default; }

    .card-position {
      min-width: 5.4rem;
      color: var(--text-secondary);
      font-family: "Noto Sans Arabic", Tahoma, Arial, sans-serif;
      font-size: 0.85rem;
      font-weight: 800;
      text-align: center;
    }

    .app-footer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 0.55rem;
      margin-block-start: 0.4rem;
    }

    .deck-hint {
      margin: 0;
      color: var(--text-secondary);
      font-family: "Noto Sans Arabic", Tahoma, Arial, sans-serif;
      font-size: 0.77rem;
      text-align: center;
    }

    .footer-haptics {
      justify-self: end;
      box-shadow: var(--shadow-soft);
    }

    .haptics-icon {
      width: 1.15rem;
      height: 1.15rem;
      flex: none;
    }

    .dhikr-card {
      position: relative;
      isolation: isolate;
      block-size: 100%;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      padding: clamp(1.15rem, 4vw, 1.75rem);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      --card-background: var(--surface);
      background: var(--card-background);
      box-shadow: var(--shadow-soft);
      transform: translateZ(0);
      transition: transform 110ms ease, border-color 180ms ease, background-color 180ms ease, box-shadow 180ms ease;
    }

    .dhikr-card::before {
      content: "";
      position: absolute;
      inset-block: 1.1rem;
      inset-inline-start: 0;
      width: 0.22rem;
      border-radius: 999px;
      background: var(--divider);
      transition: background-color 180ms ease, width 180ms ease;
    }

    .dhikr-card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      border-radius: inherit;
      background: var(--accent);
      opacity: 0;
      pointer-events: none;
      transition: opacity 90ms ease;
    }

    .dhikr-card:active::after { opacity: 0.09; }
    .dhikr-card:has(.card-reset:active)::after,
    .dhikr-card:has(.target-select:active)::after,
    .dhikr-card:has(.ayah-size-button:active)::after { opacity: 0; }

    .dhikr-card:has(.card-tap-target:active) { transform: scale(0.993); }

    .dhikr-card:has(.card-tap-target:focus-visible),
    .dhikr-card:focus-within {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 24%, transparent), var(--shadow-soft);
    }

    .dhikr-card.is-complete {
      border-color: color-mix(in srgb, var(--completed) 48%, var(--border));
      --card-background: color-mix(in srgb, var(--completed-soft) 42%, var(--surface));
      background: var(--card-background);
    }

    .dhikr-card.is-complete::before {
      width: 0.3rem;
      background: var(--completed);
    }


    .dhikr-card.needs-review {
      border-style: dashed;
      border-color: color-mix(in srgb, var(--warning) 60%, var(--border));
      background: color-mix(in srgb, var(--warning-soft) 55%, var(--surface));
      display: block;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      scrollbar-gutter: stable;
      cursor: default;
    }

    .card-index {
      display: inline-flex;
      min-width: 2rem;
      min-height: 2rem;
      align-items: center;
      justify-content: center;
      margin-block-end: 0.85rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text-secondary);
      font-family: "Noto Sans Arabic", Tahoma, Arial, sans-serif;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .card-toolbar {
      position: sticky;
      inset-block-start: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-block-end: 0.3rem;
      padding-block-end: 0.55rem;
      background: var(--card-background);
      box-shadow: 0 0.65rem 0 var(--card-background);
    }

    .card-toolbar .card-index { margin-block-end: 0; }

    .ayah-size-control {
      display: inline-flex;
      min-height: 2.25rem;
      align-items: center;
      gap: 0.12rem;
      padding: 0.14rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      direction: ltr;
      background: color-mix(in srgb, var(--surface-raised) 94%, transparent);
      box-shadow: var(--shadow-soft);
    }

    .ayah-size-button {
      display: inline-grid;
      width: 2.15rem;
      min-height: 1.95rem;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--text-primary);
      font-family: "KFGQPC Uthman Taha Naskh", var(--font-arabic);
      line-height: 1;
      cursor: pointer;
      transition: color 120ms ease, background-color 120ms ease, opacity 120ms ease, transform 100ms ease;
    }

    .ayah-size-button:not(:disabled):active {

<body data-period="morning">

  <script>
    "use strict";

    const ayatAlKursi = {
      quran: true,
      text: `اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَؤُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ ﴿٢٥٥﴾`,
      details: [
        `من قالها حين يصبح أجير من الجن حتى يمسي ومن قالها حين يمسي أجير منهم حتى يصبح. (رواه الحاكم)`,
        `«البقرة»`
      ]
    };

    const alIkhlas = {
      quran: true,
      prefix: `بسم الله الرحمن الرحيم`,
      text: `قُلْ هُوَ اللَّهُ أَحَدٌ ﴿١﴾ اللَّهُ الصَّمَدُ ﴿٢﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿٣﴾ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ ﴿٤﴾`,
      details: [`«الإخلاص»`],
      count: 3,
      countLabel: `ثلاث مرات`
    };

    const alFalaq = {
      quran: true,
      prefix: `بسم الله الرحمن الرحيم`,
      text: `قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ﴿١﴾ مِنْ شَرِّ مَا خَلَقَ ﴿٢﴾ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ﴿٣﴾ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ﴿٤﴾ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ ﴿٥﴾`,
      details: [`«الفلق»`],
      count: 3,
      countLabel: `ثلاث مرات`
    };

    const anNas = {
      quran: true,
      prefix: `بسم الله الرحمن الرحيم`,
      text: `قُلْ أَعُوذُ بِرَبِّ النَّاسِ ﴿١﴾ مَلِكِ النَّاسِ ﴿٢﴾ إِلَٰهِ النَّاسِ ﴿٣﴾ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ﴿٤﴾ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ﴿٥﴾ مِنَ الْجِنَّةِ وَالنَّاسِ ﴿٦﴾`,
      details: [`«الناس»`],
      count: 3,
      countLabel: `ثلاث مرات`

        text: `أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ رَبِّ الْعَالَمِينَ، اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ هَذِهِ اللَّيْلَةِ، فَتْحَهَا وَنَصْرَهَا وَنُورَهَا وَبَرَكَتَهَا وَهُدَاهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِيهَا وَشَرِّ مَا بَعْدَهَا.`,
        details: [`(رواه أبوداود)`]
      },
      {
        id: "evening-19",
        text: `أَمْسَيْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ، حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ.`,
        details: [`(رواه أحمد)`]
      },
      { ...tawhidDhikr, id: "evening-20" },
      { ...tasbihHundred, id: "evening-21" },
      {
        id: "evening-22",
        text: `أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.`,
        details: [`(من قالها حين يمسي ثلاث مرات لا تضره حُمَّةٌ هذه الليلة)`],
        count: 3,
        countLabel: `ثلاث مرات`
      },
      { ...salatUponProphet, id: "evening-23" }
    ];

    const collections = { morning: morningAthkar, evening: eveningAthkar };
    const sectionNames = { morning: "أذكار الصباح", evening: "أذكار المساء" };
    const storageKey = "athkar-progress-v1";
    const hapticsStorageKey = "athkar-haptics";
    const ayahTextSizeStorageKey = "athkar-text-size";
    const ayahTextSizeLevels = [
      { value: "small", label: "صغير" },
      { value: "medium", label: "متوسط" },
      { value: "large", label: "كبير" },
      { value: "xlarge", label: "كبير جدًا" }
    ];
    const numberFormatter = new Intl.NumberFormat("ar-EG", { useGrouping: false });
    const root = document.documentElement;
    const body = document.body;
    const list = document.getElementById("athkar-list");
    const panel = document.getElementById("athkar-panel");
    const previousCardButton = document.getElementById("previous-card");
    const nextCardButton = document.getElementById("next-card");
    const cardPosition = document.getElementById("card-position");
    const sessionTitle = document.getElementById("session-title");
    const progressCopy = document.getElementById("session-progress-copy");
    const progressBar = document.getElementById("session-progress");
    const sessionSummary = document.getElementById("session-summary");
    const sessionReset = document.getElementById("session-reset");
    const hapticsToggle = document.getElementById("haptics-toggle");
    const nativeSwitchSupported = root.classList.contains("supports-native-switch");
    const themeSelect = document.getElementById("theme-select");
    const themeColor = document.getElementById("theme-color");
    const liveRegion = document.getElementById("live-region");
    const dialog = document.getElementById("confirm-dialog");
    const dialogTitle = document.getElementById("dialog-title");
    const dialogCopy = document.getElementById("dialog-copy");
    const dialogConfirm = document.getElementById("dialog-confirm");
    const dialogCancel = document.getElementById("dialog-cancel");
    const motionIsReduced = matchMedia("(prefers-reduced-motion: reduce)");
    const colorScheme = matchMedia("(prefers-color-scheme: dark)");
    const currentIndices = { morning: null, evening: null };
    let swipeGesture = null;
    let suppressCardClicksUntil = 0;

    let activePeriod = location.hash === "#evening" ? "evening" : "morning";
    let pendingConfirmation = null;
    let advanceTimer = null;
    let state = loadState();
    let hapticsEnabled = true;
    try { hapticsEnabled = localStorage.getItem(hapticsStorageKey) !== "off"; } catch (_) {}
    hapticsToggle.checked = hapticsEnabled;
    let ayahTextSizeIndex = ayahTextSizeLevels.findIndex(level => level.value === root.dataset.ayahTextSize);
    if (ayahTextSizeIndex === -1) ayahTextSizeIndex = 1;

    function emptyState() {
      return {
        progress: { morning: {}, evening: {} },
        targets: { morning: {}, evening: {} }
      };
    }

    function loadState() {
      try {
        const parsed = JSON.parse(localStorage.getItem(storageKey));
        if (!parsed || typeof parsed !== "object") return emptyState();
        return {
          progress: {
            morning: parsed.progress?.morning && typeof parsed.progress.morning === "object" ? parsed.progress.morning : {},
            evening: parsed.progress?.evening && typeof parsed.progress.evening === "object" ? parsed.progress.evening : {}
          },
          targets: {
            morning: parsed.targets?.morning && typeof parsed.targets.morning === "object" ? parsed.targets.morning : {},
            evening: parsed.targets?.evening && typeof parsed.targets.evening === "object" ? parsed.targets.evening : {}
          }
        };
      } catch (_) {
        return emptyState();
      }
    }

    function saveState() {
      try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch (_) {}
    }

    function formatNumber(value) {
      return numberFormatter.format(value);
    }

    function targetFor(item, period = activePeriod) {
      if (item.targetOptions) {
        const stored = Number(state.targets[period][item.id]);
        return item.targetOptions.includes(stored) ? stored : item.defaultTarget;
      }
      return item.count || 1;
    }

    function countFor(item, period = activePeriod) {
      const raw = Number(state.progress[period][item.id]);
      if (!Number.isFinite(raw) || raw < 0) return 0;
      return Math.min(Math.floor(raw), targetFor(item, period));
    }

    function isExplicitlyCounted(item) {
      return Boolean(item.count || item.targetOptions);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function cardMarkup(item, index) {
      if (item.review) {
        return `
          <li data-card-index="${index}">
            <article class="dhikr-card needs-review" id="${item.id}" aria-labelledby="${item.id}-title">
              <span class="card-index" aria-hidden="true">${formatNumber(index + 1)}</span>
              <span class="review-badge">بحاجة إلى مراجعة</span>
              <h3 class="dhikr-text" id="${item.id}-title">${escapeHtml(item.reviewTitle)}</h3>
              <p class="review-copy">${escapeHtml(item.reviewCopy)}</p>
            </article>
          </li>`;
      }

      const counted = isExplicitlyCounted(item);
      const target = targetFor(item);
      const count = countFor(item);
      const details = (item.details || []).map((detail, detailIndex) =>
        `<p class="dhikr-detail${detailIndex === item.noteIndex ? " dhikr-note" : ""}">${escapeHtml(detail)}</p>`
      ).join("");
      const options = item.targetOptions ? `
        <label class="target-control">
          <span>الهدف</span>
          <select class="target-select" data-target-for="${item.id}" aria-label="اختيار عدد تكرار الذكر ${formatNumber(index + 1)}">
            ${item.targetOptions.map(option => `<option value="${option}"${option === target ? " selected" : ""}>${formatNumber(option)}</option>`).join("")}
          </select>
        </label>` : "";
      const requirement = item.countLabel
        ? `<p class="count-requirement">${escapeHtml(item.countLabel)}</p>`
        : `<p class="count-requirement">مرة واحدة</p>`;
      const visibleStatus = counted
        ? `<output class="counter-status numeric" id="${item.id}-status"><span class="counter-current">${formatNumber(count)}</span><span aria-hidden="true">/</span><span class="counter-target">${formatNumber(target)}</span><span class="counter-check" aria-hidden="true">✓</span></output>`
        : `<output class="counter-status" id="${item.id}-status"><span class="single-copy">${count ? "تمت القراءة" : "اضغط بعد القراءة"}</span><span class="counter-check" aria-hidden="true">✓</span></output>`;
      const cardHeader = item.quran ? `
        <div class="card-toolbar">
          <span class="card-index" aria-hidden="true">${formatNumber(index + 1)}</span>
          <div class="ayah-size-control" role="group" aria-label="حجم نص الآيات: ${ayahTextSizeLevels[ayahTextSizeIndex].label}">
            <button class="ayah-size-button ayah-size-decrease" type="button" aria-label="تصغير نص الآيات"${ayahTextSizeIndex === 0 ? " disabled" : ""}>
              <span class="ayah-size-glyph-small" aria-hidden="true">أ</span>
            </button>
            <button class="ayah-size-button ayah-size-increase" type="button" aria-label="تكبير نص الآيات"${ayahTextSizeIndex === ayahTextSizeLevels.length - 1 ? " disabled" : ""}>
              <span class="ayah-size-glyph-large" aria-hidden="true">أ</span>
            </button>
          </div>
        </div>` : `<span class="card-index" aria-hidden="true">${formatNumber(index + 1)}</span>`;

      return `
        <li data-card-index="${index}">
          <article class="dhikr-card${item.quran ? " quran" : ""}" id="${item.id}" data-id="${item.id}">
            <div class="card-content">
              ${cardHeader}
              ${item.prefix ? `<p class="dhikr-prefix">${escapeHtml(item.prefix)}</p>` : ""}
              <p class="dhikr-text">${escapeHtml(item.text)}</p>
              ${details ? `<div class="dhikr-details">${details}</div>` : ""}
            </div>
            <div class="requirement-row">
              <div>
                ${requirement}
                ${options}
              </div>
              <div class="counter-cluster">
                ${visibleStatus}
                <button class="card-reset" type="button" data-reset="${item.id}" aria-label="إعادة عداد الذكر ${formatNumber(index + 1)}"${count === 0 ? " disabled" : ""}>
                  <span aria-hidden="true">↻</span><span>إعادة</span>
                </button>
              </div>
            </div>
            <button class="card-tap-target" type="button" data-increment="${item.id}" aria-describedby="${item.id}-status"></button>
          </article>
        </li>`;
    }

    function progressLabel(item, index, count, target) {
      if (!isExplicitlyCounted(item)) {
        return count >= 1
          ? `ذكر ${formatNumber(index + 1)}، تمت قراءته`
          : `ذكر ${formatNumber(index + 1)}، لم يُعلَّم كمقروء`;
      }
      const completed = count >= target;
      return `ذكر ${formatNumber(index + 1)}، تم تكراره ${formatNumber(count)} من أصل ${formatNumber(target)} مرات${completed ? "، اكتمل" : ""}`;
    }

    function updateCard(item, card, index, announce = false) {
      const target = targetFor(item);
      const count = countFor(item);
      const completed = count >= target;
      const status = card.querySelector(".counter-status");
      const tapTarget = card.querySelector(".card-tap-target");
      const reset = card.querySelector(".card-reset");
      const label = progressLabel(item, index, count, target);

      card.classList.toggle("is-complete", completed);
      reset.disabled = count === 0;
      tapTarget.setAttribute("aria-disabled", String(completed));
      tapTarget.setAttribute("aria-label", isExplicitlyCounted(item)
        ? `زيادة عداد الذكر ${formatNumber(index + 1)}. ${label}`
        : `${count ? "اكتمل" : "تحديد كمقروء"}، الذكر ${formatNumber(index + 1)}. ${label}`);
      status.setAttribute("aria-label", label);

      if (isExplicitlyCounted(item)) {
        status.querySelector(".counter-current").textContent = formatNumber(count);
        status.querySelector(".counter-target").textContent = formatNumber(target);
      } else {
        status.querySelector(".single-copy").textContent = completed ? "تمت القراءة" : "اضغط بعد القراءة";
      }

      if (announce) liveRegion.textContent = label;
    }

    function firstIncompleteIndex(period) {
      const items = collections[period];
      const index = items.findIndex(item => !item.review && countFor(item, period) < targetFor(item, period));
      return index === -1 ? Math.max(0, items.length - 1) : index;
    }

    function updateDeckNavigation() {
      const items = collections[activePeriod];
      const index = currentIndices[activePeriod] ?? 0;
      const item = items[index];
      const completed = item?.review || countFor(item) >= targetFor(item);

      previousCardButton.disabled = index <= 0;
      nextCardButton.disabled = index >= items.length - 1 || !completed;
      cardPosition.textContent = `${formatNumber(index + 1)} من ${formatNumber(items.length)}`;
      cardPosition.setAttribute("aria-label", `الذكر ${formatNumber(index + 1)} من ${formatNumber(items.length)}`);
      list.setAttribute("aria-label", `بطاقات ${sectionNames[activePeriod]}، الذكر ${formatNumber(index + 1)} من ${formatNumber(items.length)}`);
    }

    function showCard(index, direction = "forward", scrollToCard = false, announce = false) {
      clearTimeout(advanceTimer);
      const items = collections[activePeriod];
      const nextIndex = Math.max(0, Math.min(index, items.length - 1));
      currentIndices[activePeriod] = nextIndex;

      [...list.children].forEach((listItem, itemIndex) => {
        const active = itemIndex === nextIndex;
        listItem.hidden = !active;
        listItem.classList.remove("card-enter-forward", "card-enter-back");
        const card = listItem.querySelector(".dhikr-card");
        if (active) card?.setAttribute("aria-current", "step");
        else card?.removeAttribute("aria-current");
      });

      const activeItem = list.children[nextIndex];
      if (direction && activeItem) {
        requestAnimationFrame(() => {
          activeItem.classList.add(direction === "back" ? "card-enter-back" : "card-enter-forward");
          setTimeout(() => activeItem.classList.remove("card-enter-forward", "card-enter-back"), 240);
        });
      }

      updateDeckNavigation();
      if (announce) {
        liveRegion.textContent = `الذكر ${formatNumber(nextIndex + 1)} من ${formatNumber(items.length)}`;
      }
      if (scrollToCard) {
        requestAnimationFrame(() => list.scrollIntoView({
          behavior: motionIsReduced.matches ? "auto" : "smooth",
          block: "start"
        }));
      }
    }

    function scheduleAdvance(item, index) {
      if (index >= collections[activePeriod].length - 1) return;
      const period = activePeriod;
      advanceTimer = setTimeout(() => {
        if (activePeriod !== period || currentIndices[period] !== index) return;
        if (countFor(item, period) < targetFor(item, period)) return;
        showCard(index + 1, "forward", true, true);
      }, motionIsReduced.matches ? 20 : 320);
    }

    function beginCardSwipe(event) {
      if (!event.isPrimary || event.pointerType === "mouse") return;
      if (event.target.closest("button, select, input, label")) return;
      swipeGesture = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        startedAt: performance.now()
      };
    }

    function cancelCardSwipe(event) {
      if (!swipeGesture || event.pointerId !== swipeGesture.pointerId) return;
      swipeGesture = null;
    }

    function finishCardSwipe(event) {
      if (!swipeGesture || event.pointerId !== swipeGesture.pointerId) return;
      const gesture = swipeGesture;
      swipeGesture = null;

      const deltaX = event.clientX - gesture.startX;
      const deltaY = event.clientY - gesture.startY;
      const distance = Math.abs(deltaX);
      const threshold = Math.max(48, Math.min(72, innerWidth * 0.14));
      const horizontal = distance >= threshold && distance > Math.abs(deltaY) * 1.25;
      if (!horizontal || performance.now() - gesture.startedAt > 900) return;

      event.preventDefault();
      suppressCardClicksUntil = performance.now() + 450;
      if (deltaX < 0 && !nextCardButton.disabled) nextCardButton.click();
      if (deltaX > 0 && !previousCardButton.disabled) previousCardButton.click();
    }

    function renderCards() {
      const items = collections[activePeriod];
      if (!Number.isInteger(currentIndices[activePeriod])) {
        currentIndices[activePeriod] = firstIncompleteIndex(activePeriod);
      }
      currentIndices[activePeriod] = Math.min(currentIndices[activePeriod], items.length - 1);
      list.innerHTML = items.map(cardMarkup).join("");
      syncAyahTextSizeControls();
      list.classList.remove("is-entering");
      requestAnimationFrame(() => list.classList.add("is-entering"));

      items.forEach((item, index) => {
        if (item.review) return;
        const card = document.getElementById(item.id);
        const tapTarget = card.querySelector(".card-tap-target");
        const resetButton = card.querySelector(".card-reset");
        const targetSelect = card.querySelector(".target-select");
        const sizeDecrease = card.querySelector(".ayah-size-decrease");
        const sizeIncrease = card.querySelector(".ayah-size-increase");

        updateCard(item, card, index);
        tapTarget.addEventListener("click", () => {
          if (performance.now() < suppressCardClicksUntil) return;
          increment(item, card, index);
        });
        card.addEventListener("click", event => {
          if (performance.now() < suppressCardClicksUntil) return;
          if (event.target.closest(".card-tap-target, .card-reset, .target-control, .ayah-size-control")) return;
          increment(item, card, index);
        });
        resetButton.addEventListener("click", () => requestItemReset(item, card, index));
        sizeDecrease?.addEventListener("click", event => {
          event.stopPropagation();
          applyAyahTextSize(ayahTextSizeIndex - 1);
        });
        sizeIncrease?.addEventListener("click", event => {
          event.stopPropagation();
          applyAyahTextSize(ayahTextSizeIndex + 1);
        });

        if (targetSelect) {
          targetSelect.addEventListener("change", event => {
            const wasComplete = countFor(item) >= targetFor(item);
            const target = Number(event.target.value);
            if (!item.targetOptions.includes(target)) return;
            state.targets[activePeriod][item.id] = target;
            state.progress[activePeriod][item.id] = Math.min(countFor(item), target);
            saveState();
            updateCard(item, card, index, true);
            updateSessionProgress();
            updateDeckNavigation();
            if (!wasComplete && countFor(item) >= targetFor(item)) scheduleAdvance(item, index);
          });
        }
      });

      showCard(currentIndices[activePeriod], "forward");
      updateSessionProgress();
    }

    function triggerHaptic(duration) {
      if (!hapticsEnabled || typeof navigator.vibrate !== "function") return false;
      return navigator.vibrate(duration);
    }

    function increment(item, card, index) {
      const target = targetFor(item);
      const before = countFor(item);
      if (before >= target) return;

      const next = before + 1;
      const completesItem = next === target;
      if (completesItem) triggerHaptic(35);

      state.progress[activePeriod][item.id] = next;
      saveState();
      updateCard(item, card, index, true);
      updateSessionProgress();
      updateDeckNavigation();

      if (completesItem) scheduleAdvance(item, index);
    }

    function requestItemReset(item, card, index) {
      const count = countFor(item);
      if (!count) return;
      const reset = () => {
        state.progress[activePeriod][item.id] = 0;
        saveState();
        updateCard(item, card, index, true);
        updateSessionProgress();
        updateDeckNavigation();
      };

      if (targetFor(item) >= 50) {
        openConfirmation(
          `إعادة عداد الذكر ${formatNumber(index + 1)}؟`,
          `سيعود العداد من ${formatNumber(count)} إلى الصفر.`,
          reset
        );
      } else {
        reset();
      }
    }

    function updateSessionProgress() {
      const items = collections[activePeriod].filter(item => !item.review);
      const completed = items.filter(item => countFor(item) >= targetFor(item)).length;
      const hasProgress = items.some(item => countFor(item) > 0);
      const isComplete = completed === items.length;
      const suffix = activePeriod === "morning" && collections.morning.some(item => item.review) ? " ذكرًا متاحًا" : " ذكرًا";

      progressCopy.textContent = isComplete
        ? `اكتملت ${sectionNames[activePeriod]} بحمد الله`
        : `${formatNumber(completed)} من ${formatNumber(items.length)}${suffix}`;
      progressBar.max = items.length;
      progressBar.value = completed;
      progressBar.setAttribute("aria-label", `${sectionNames[activePeriod]}: ${formatNumber(completed)} من ${formatNumber(items.length)} مكتملة`);
      sessionReset.disabled = !hasProgress;
      sessionSummary.classList.toggle("is-complete", isComplete);
    }

    function switchPeriod(period, updateHash = true) {
      if (!collections[period]) return;
      activePeriod = period;
      body.dataset.period = period;
      sessionTitle.textContent = sectionNames[period];
      sessionReset.setAttribute("aria-label", `إعادة ${sectionNames[period]}`);
      panel.setAttribute("aria-labelledby", `${period}-tab`);
      document.title = `${sectionNames[period]} — أذكار المسلم`;

      document.querySelectorAll(".period-tab").forEach(tab => {
        const selected = tab.dataset.period === period;
        tab.setAttribute("aria-selected", String(selected));
        tab.tabIndex = selected ? 0 : -1;
      });

      if (updateHash && location.hash !== `#${period}`) {
        history.replaceState(null, "", `#${period}`);
      }

      renderCards();
    }

    function requestSessionReset() {
      const items = collections[activePeriod].filter(item => !item.review);
      if (!items.some(item => countFor(item) > 0)) return;
      const periodAtRequest = activePeriod;
      openConfirmation(
        `إعادة ${sectionNames[periodAtRequest]}؟`,
        `ستعود جميع عدادات ${sectionNames[periodAtRequest]} إلى الصفر. لا يؤثر ذلك في القسم الآخر.`,
        () => {
          state.progress[periodAtRequest] = {};
          state.targets[periodAtRequest] = {};
          currentIndices[periodAtRequest] = 0;
          saveState();
          if (activePeriod === periodAtRequest) renderCards();
          liveRegion.textContent = `أُعيدت ${sectionNames[periodAtRequest]}`;
        }
      );
    }

    function openConfirmation(title, copy, callback) {
      dialogTitle.textContent = title;
      dialogCopy.textContent = copy;
      pendingConfirmation = callback;
      if (typeof dialog.showModal === "function") {
        dialog.showModal();
      } else if (window.confirm(`${title}\n${copy}`)) {
        const action = pendingConfirmation;
        pendingConfirmation = null;
        action?.();
      }
    }

    function resolveTheme(preference) {
      return preference === "dark" || (preference === "system" && colorScheme.matches) ? "dark" : "light";
    }

    function applyTheme(preference, save = true) {
      const normalized = ["light", "dark", "system"].includes(preference) ? preference : "system";
      const resolved = resolveTheme(normalized);
      root.dataset.theme = normalized;
      root.dataset.resolvedTheme = resolved;
      themeSelect.value = normalized;
      themeColor.content = resolved === "dark" ? "#202c38" : "#f7f5ef";
      if (save) {
        try { localStorage.setItem("athkar-theme", normalized); } catch (_) {}
      }
    }

    function syncAyahTextSizeControls() {
      const level = ayahTextSizeLevels[ayahTextSizeIndex];
      list.querySelectorAll(".ayah-size-control").forEach(control => {
        control.setAttribute("aria-label", `حجم نص الآيات: ${level.label}`);
        control.querySelector(".ayah-size-decrease").disabled = ayahTextSizeIndex === 0;
        control.querySelector(".ayah-size-increase").disabled = ayahTextSizeIndex === ayahTextSizeLevels.length - 1;
      });
    }

    function applyAyahTextSize(index, save = true, announce = true) {
      ayahTextSizeIndex = Math.max(0, Math.min(ayahTextSizeLevels.length - 1, index));
      const level = ayahTextSizeLevels[ayahTextSizeIndex];
      root.dataset.ayahTextSize = level.value;
      syncAyahTextSizeControls();
      if (save) {
        try { localStorage.setItem(ayahTextSizeStorageKey, level.value); } catch (_) {}
      }
      if (announce) liveRegion.textContent = `حجم نص الآيات ${level.label}`;
    }

    document.querySelectorAll(".period-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        if (tab.dataset.period === activePeriod) return;
        switchPeriod(tab.dataset.period);
        window.scrollTo({ top: 0, behavior: "auto" });
      });
      tab.addEventListener("keydown", event => {
        if (!["ArrowLeft", "ArrowRight"].includes(event.key)) return;
        event.preventDefault();
        const nextPeriod = activePeriod === "morning" ? "evening" : "morning";
        switchPeriod(nextPeriod);
        document.getElementById(`${nextPeriod}-tab`).focus();
      });
    });

    list.addEventListener("pointerdown", beginCardSwipe);
    addEventListener("pointerup", finishCardSwipe);
    addEventListener("pointercancel", cancelCardSwipe);

    sessionReset.addEventListener("click", requestSessionReset);
    previousCardButton.addEventListener("click", () => {
      showCard((currentIndices[activePeriod] ?? 0) - 1, "back", true, true);
    });
    nextCardButton.addEventListener("click", () => {
      showCard((currentIndices[activePeriod] ?? 0) + 1, "forward", true, true);
    });
    themeSelect.addEventListener("change", event => applyTheme(event.target.value));
    hapticsToggle.addEventListener("click", () => {
      if (!nativeSwitchSupported && typeof navigator.vibrate === "function") {
        navigator.vibrate(15);
      }
    });
    hapticsToggle.addEventListener("change", () => {
      hapticsEnabled = hapticsToggle.checked;
      try { localStorage.setItem(hapticsStorageKey, hapticsEnabled ? "on" : "off"); } catch (_) {}
      liveRegion.textContent = hapticsEnabled ? "تم تشغيل الاهتزاز" : "تم إيقاف الاهتزاز";
    });

    colorScheme.addEventListener?.("change", () => {
      if (root.dataset.theme === "system") applyTheme("system", false);
    });

    addEventListener("hashchange", () => {
      const period = location.hash === "#evening" ? "evening" : location.hash === "#morning" ? "morning" : null;
      if (period && period !== activePeriod) switchPeriod(period, false);
    });

    dialogCancel.addEventListener("click", () => {
      pendingConfirmation = null;
      dialog.close();
    });

    dialogConfirm.addEventListener("click", () => {
      const action = pendingConfirmation;
      pendingConfirmation = null;
      dialog.close();
      action?.();
    });

    dialog.addEventListener("cancel", () => { pendingConfirmation = null; });
    dialog.addEventListener("click", event => {
      if (event.target === dialog) {
        pendingConfirmation = null;
        dialog.close();
      }
    });

    if ("serviceWorker" in navigator) {
      addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
      }, { once: true });
    }

    let storedTheme = "system";
    try {
      const savedTheme = localStorage.getItem("athkar-theme");
      if (["light", "dark", "system"].includes(savedTheme)) storedTheme = savedTheme;
    } catch (_) {}
    applyAyahTextSize(ayahTextSizeIndex, false, false);
    applyTheme(storedTheme, false);
    switchPeriod(activePeriod, false);
  </script>
</body>
</html>
