name: Athkar
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
packages:
  AthkarCore:
    path: AthkarCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Placeholder: no product bundle ID until the identity gate (NATIVE_APP_PLAN.md 8.1).
    PRODUCT_BUNDLE_IDENTIFIER: local.dev.athkar
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Athkar:
    type: application
    platform: iOS
    sources:
      - Athkar
      # Bundled from the repository in place (NATIVE_APP_PLAN.md §5.4): packs, manifest and the Quran font.
      - path: ../content/manifest.json
        buildPhase: resources
        group: Resources
      - path: ../content/adhkar.v1.json
        buildPhase: resources
        group: Resources
      - path: ../content/ruqyah.v1.json
        buildPhase: resources
        group: Resources
      - path: ../fonts/kfgqpc-uthman-taha-naskh.ttf
        buildPhase: resources
        group: Resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: AthkarCore
    info:
      path: Athkar/Info.plist
      properties:
        CFBundleDevelopmentRegion: ar
        CFBundleDisplayName: بكرة وأصيلا
        # One-shot, when-in-use, prayer times only (NATIVE_APP_PLAN.md §7.4, §8.5).
        NSLocationWhenInUseUsageDescription: يُطلب موقعك مرة واحدة عند الحاجة، لحساب مواقيت الصلاة فقط. يُحفظ على جهازك بدقة تقريبية ولا يُرسل إلى أي جهة.
        UILaunchScreen: {}
        UIAppFonts: [kfgqpc-uthman-taha-naskh.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  AthkarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AthkarUITests]
    dependencies:
      - target: Athkar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.dev.athkar.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Athkar:
    build:
      targets: {Athkar: all}
    test:
      targets: [AthkarUITests]
