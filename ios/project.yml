name: Athkar
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
packages:
  AthkarCore:
    path: AthkarCore
  # AthkarCore's own pin (AthkarCore/Package.swift), for AthkarTests to link.
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.11.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Placeholder: no product bundle ID until the identity gate (NATIVE_APP_PLAN.md 8.1).
    PRODUCT_BUNDLE_IDENTIFIER: local.dev.athkar
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Athkar:
    type: application
    platform: iOS
    sources:
      - Athkar
      # Bundled from the repository in place (NATIVE_APP_PLAN.md §5.4): packs, manifest and the Quran font.
      - path: ../content/manifest.json
        buildPhase: resources
        group: Resources
      - path: ../content/adhkar.v1.json
        buildPhase: resources
        group: Resources
      - path: ../content/ruqyah.v1.json
        buildPhase: resources
        group: Resources
      - path: ../content/suwar.v1.json
        buildPhase: resources
        group: Resources
      - path: ../fonts/kfgqpc-uthman-taha-naskh.ttf
        buildPhase: resources
        group: Resources
      - path: ../fonts/kfgqpc-hafs-v30.ttf
        buildPhase: resources
        group: Resources
      # Offline city list for manual location (data/README.md).
      - path: ../data/cities.tsv
        buildPhase: resources
        group: Resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: AthkarCore
    info:
      path: Athkar/Info.plist
      properties:
        CFBundleDevelopmentRegion: ar
        CFBundleDisplayName: بكرة وأصيلا
        CFBundleShortVersionString: "1.3"
        CFBundleVersion: "4"
        # One-shot, when-in-use, prayer times only (NATIVE_APP_PLAN.md §7.4, §8.5).
        NSLocationWhenInUseUsageDescription: يُطلب موقعك مرة واحدة عند الحاجة، لحساب مواقيت الصلاة واتجاه القبلة فقط. يُحفظ على جهازك بدقة تقريبية ولا يُرسل إلى أي جهة.
        UILaunchScreen: {}
        UIAppFonts: [kfgqpc-uthman-taha-naskh.ttf, kfgqpc-hafs-v30.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  AthkarTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AthkarTests]
    dependencies:
      - target: Athkar
      - package: AthkarCore
      # The tests use GRDB's API on AppDatabase.writer. Xcode builds GRDB as its own framework
      # when two targets use it, so the bundle links GRDB itself.
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.dev.athkar.tests
        GENERATE_INFOPLIST_FILE: YES
  AthkarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AthkarUITests]
    dependencies:
      - target: Athkar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.dev.athkar.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Athkar:
    build:
      targets: {Athkar: all}
    test:
      targets: [AthkarTests, AthkarUITests]
