name: Athkar
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
packages:
  AthkarCore:
    path: AthkarCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Placeholder: no product bundle ID until the identity gate (NATIVE_APP_PLAN.md 8.1).
    PRODUCT_BUNDLE_IDENTIFIER: local.dev.athkar
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Athkar:
    type: application
    platform: iOS
    sources: [Athkar]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: AthkarCore
    info:
      path: Athkar/Info.plist
      properties:
        CFBundleDevelopmentRegion: ar
        CFBundleDisplayName: بكرة وأصيلا
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  AthkarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AthkarUITests]
    dependencies:
      - target: Athkar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.dev.athkar.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Athkar:
    build:
      targets: {Athkar: all}
    test:
      targets: [AthkarUITests]
