name: Athkar
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
packages:
  AthkarCore:
    path: AthkarCore
  # AthkarCore's own pin (AthkarCore/Package.swift), for AthkarTests to link.
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.11.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Placeholder: no product bundle ID until the identity gate (NATIVE_APP_PLAN.md 8.1).
    PRODUCT_BUNDLE_IDENTIFIER: local.dev.athkar
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Athkar:
    type: application
    platform: iOS
    sources:
      - Athkar
      # Bundled from the repository in place (NATIVE_APP_PLAN.md §5.4): packs, manifest and the Quran font.
      - path: ../content/manifest.json
        buildPhase: resources
        group: Resources
      - path: ../content/adhkar.v1.json
        buildPhase: resources
        group: Resources
      - path: ../content/ruqyah.v1.json
        buildPhase: resources
        group: Resources
      - path: ../content/suwar.v1.json
        buildPhase: resources
        group: Resources
      - path: ../fonts/kfgqpc-uthman-taha-naskh.ttf
        buildPhase: resources
        group: Resources
      - path: ../fonts/kfgqpc-hafs-v30.ttf
        buildPhase: resources
        group: Resources
      # Offline city list for manual location (data/README.md).
      - path: ../data/cities.tsv
        buildPhase: resources
        group: Resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # «أيقونة التطبيق» in الإعدادات (tools/app-icons.py); Xcode lists it under CFBundleAlternateIcons.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconHorizon
    dependencies:
      - package: AthkarCore
      - target: AthkarWidget
    info:
      path: Athkar/Info.plist
      properties:
        CFBundleDevelopmentRegion: ar
        CFBundleDisplayName: بكرة وأصيلا
        CFBundleShortVersionString: "1.5"
        CFBundleVersion: "6"
        # One-shot, when-in-use, prayer times only (NATIVE_APP_PLAN.md §7.4, §8.5).
        NSLocationWhenInUseUsageDescription: يُطلب موقعك مرة واحدة عند الحاجة، لحساب مواقيت الصلاة واتجاه القبلة فقط. يُحفظ على جهازك بدقة تقريبية ولا يُرسل إلى أي جهة.
        # «مسح رمز QR» in «استيراد من تطبيق الويب» (NATIVE_APP_PLAN.md §6.4): the camera only reads the code.
        NSCameraUsageDescription: تُستخدم الكاميرا لقراءة رمز QR لنقل التقدّم من تطبيق الويب فقط. يُقرأ الرمز على جهازك، ولا تُحفظ الصور ولا تُرسل إلى أي جهة.
        # A transfer code saved as text, or a PWA backup, opened from Files or the share sheet; it is copied in, not
        # edited in place.
        CFBundleDocumentTypes:
          - CFBundleTypeName: نسخة احتياطية من «أذكار المسلم»
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [local.dev.athkar.backup]
          - CFBundleTypeName: رمز نقل التقدّم
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text, public.json]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: local.dev.athkar.backup
            UTTypeDescription: نسخة احتياطية من «أذكار المسلم»
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [athkarbackup]
        LSSupportsOpeningDocumentsInPlace: false
        # athkar://morning, evening, ruqyah, prayers (spec/routes.md). A custom scheme only: universal links need an
        # associated domain, which waits for the publisher identity (NATIVE_APP_PLAN.md §8.1).
        CFBundleURLTypes:
          - CFBundleURLName: local.dev.athkar.routes
            CFBundleURLSchemes: [athkar]
        # The home-screen quick actions, one per route (spec/routes.md).
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: athkar.route.morning
            UIApplicationShortcutItemTitle: أذكار الصباح
            UIApplicationShortcutItemIconSymbolName: sun.max
          - UIApplicationShortcutItemType: athkar.route.evening
            UIApplicationShortcutItemTitle: أذكار المساء
            UIApplicationShortcutItemIconSymbolName: moon
          - UIApplicationShortcutItemType: athkar.route.ruqyah
            UIApplicationShortcutItemTitle: رقية القرين
            UIApplicationShortcutItemIconSymbolName: book
          - UIApplicationShortcutItemType: athkar.route.prayers
            UIApplicationShortcutItemTitle: سجّل الصلاة
            UIApplicationShortcutItemIconSymbolName: checkmark.circle
        # The opportunistic reminder refresh (NATIVE_APP_PLAN.md §7.5): iOS decides whether and when it runs.
        BGTaskSchedulerPermittedIdentifiers: [local.dev.athkar.reminders.refresh]
        UIBackgroundModes: [fetch]
        UILaunchScreen: {}
        UIAppFonts: [kfgqpc-uthman-taha-naskh.ttf, kfgqpc-hafs-v30.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  # The lock-screen widget (ios/AthkarWidget). Its versions must equal the app's.
  AthkarWidget:
    type: app-extension
    platform: iOS
    sources: [AthkarWidget]
    dependencies:
      - package: AthkarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.dev.athkar.widget
    info:
      path: AthkarWidget/Info.plist
      properties:
        CFBundleDevelopmentRegion: ar
        CFBundleDisplayName: بكرة وأصيلا
        CFBundleShortVersionString: "1.5"
        CFBundleVersion: "6"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  AthkarTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AthkarTests]
    dependencies:
      - target: Athkar
      - package: AthkarCore
      # The tests use GRDB's API on AppDatabase.writer. Xcode builds GRDB as its own framework
      # when two targets use it, so the bundle links GRDB itself.
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.dev.athkar.tests
        GENERATE_INFOPLIST_FILE: YES
  AthkarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AthkarUITests]
    dependencies:
      - target: Athkar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.dev.athkar.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Athkar:
    build:
      targets: {Athkar: all}
    test:
      targets: [AthkarTests, AthkarUITests]
